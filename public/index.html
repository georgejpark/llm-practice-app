<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    textarea { width: 100%; min-height: 90px; font: inherit; padding: .5rem; box-sizing: border-box; }
    button { font: inherit; padding: .5rem 1rem; margin-top: .5rem; cursor: pointer; }
    .msg { padding: .75rem; border-radius: 8px; margin: .5rem 0; white-space: pre-wrap; }
    .user { background: #e8eef7; }
    .assistant { background: #f3f3f3; }
    .meta { color: #777; font-size: .85rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Ask the Assistant</h1>
  <p class="meta">Minimal UI for the <code>POST /api/ask</code> endpoint. Conversation history is kept in the page and sent with each request.</p>
  <div id="log"></div>
  <form id="form">
    <textarea id="question" placeholder="Type a question..." required></textarea>
    <button type="submit" id="send">Send</button>
    <button type="button" id="clear">Clear</button>
  </form>
  <p id="status" class="meta"></p>

  <script>
    const history = [];
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('question');
    const status = document.getElementById('status');
    const send = document.getElementById('send');

    function add(role, text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls || role}`;
      div.textContent = text;
      log.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      add('user', question);
      input.value = '';
      send.disabled = true;
      status.textContent = 'Thinking...';
      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ question, history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        add('assistant', data.answer);
        history.push({ role: 'user', content: question }, { role: 'assistant', content: data.answer });
        status.textContent = `${data.provider} / ${data.model} · ${data.usage.inputTokens} in, ${data.usage.outputTokens} out · ${data.latencyMs} ms`;
      } catch (err) {
        add('assistant', `Error: ${err.message}`, 'error');
        status.textContent = '';
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    document.getElementById('clear').addEventListener('click', () => {
      history.length = 0;
      log.innerHTML = '';
      status.textContent = '';
    });
  </script>
</body>
</html>
